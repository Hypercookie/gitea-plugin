# IntelliJ 2025.2 to 2026.2. See docs/platform-versions.md.

# IDE the plugin compiles and runs tests against: the oldest line it supports.
platformVersion = 2025.2.6.3
sinceBuild = 252
untilBuild = 262.*
# IDE lines verifyPlugin checks, one CI job each (the newest build of each).
verifyLines = 252,253,261,262

bundledPlugins = Git4Idea
# Only on the test classpath.
testBundledPlugins =
# Modules on the compile classpath. Those the plugin's code uses at runtime
# are also declared in resources/META-INF/gitea-platform.xml.
#  - collaborationTools: the code review UI the bundled GitHub/GitLab plugins
#    are built on (list, details, review in editor, comments). Public,
#    non-@Internal API only; verifyPlugin enforces this.
#  - vcs.dvcs.impl, vcs.dvcs.impl.shared, vcs.log.impl: collaborationTools'
#    own module dependencies; without them Git4Idea's GitRepository
#    supertypes stop resolving.
#  - vcs.impl: AsyncChangesTree (the PR changes tree).
bundledModules = \
  intellij.platform.collaborationTools,\
  intellij.platform.vcs.dvcs.impl,\
  intellij.platform.vcs.dvcs.impl.shared,\
  intellij.platform.vcs.log.impl,\
  intellij.platform.vcs.impl
