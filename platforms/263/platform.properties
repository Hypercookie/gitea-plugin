# IntelliJ 2026.3. See docs/platform-versions.md.

# 2026.3 moves VCS into a bundled "Version Control" plugin and splits it
# into modules that don't exist in 252 to 262 (vcs.core, vcs.shared,
# vcs.log, vcs.dvcs), and moves part of collaborationTools into
# collaborationTools.shared. A descriptor can't depend on a module the IDE
# lacks, so this line gets its own build.
platformVersion = 263.7307.44
sinceBuild = 263
untilBuild = 263.*
verifyLines = 263

bundledPlugins = Git4Idea,com.intellij.platform.vcs
# XML moved into a bundled plugin in 263; GiteaCommentCodeBlockFilterTest
# injects into XmlText.
testBundledPlugins = com.intellij.xml,com.intellij.java
bundledModules = \
  intellij.platform.collaborationTools,\
  intellij.platform.collaborationTools.shared,\
  intellij.platform.vcs.core,\
  intellij.platform.vcs.shared,\
  intellij.platform.vcs,\
  intellij.platform.vcs.impl,\
  intellij.platform.vcs.impl.shared,\
  intellij.platform.vcs.log,\
  intellij.platform.vcs.log.impl,\
  intellij.platform.vcs.dvcs,\
  intellij.platform.vcs.dvcs.impl,\
  intellij.platform.vcs.dvcs.impl.shared
