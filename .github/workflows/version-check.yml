# Weekly check for new IntelliJ Platform builds and lines (EAP included) and
# new Gitea releases (scripts/check-version-updates.py). Updates go to one
# pull request on the version-updates branch, refreshed on every run, whose
# Build run verifies them: compile and tests per IDE line, the Plugin
# Verifier per IDE line, and the live tests per Gitea version.
#
# A new IDE line first extends the newest profile's range. When that fails
# verification, the line needs its own profile: run the update script with
# --new-profile and add what the line changed (docs/platform-versions.md).

name: Version Check
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    name: Check for new versions
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Update versions
        id: update
        run: |
          python3 scripts/check-version-updates.py --write > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=version-updates
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Support new IntelliJ Platform and Gitea versions" -m "$(cat "$RUNNER_TEMP/summary.md")"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "Support new IntelliJ Platform and Gitea versions" \
              --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/summary.md"
          fi
          # Pushes made with GITHUB_TOKEN start no workflow by themselves.
          gh workflow run build.yml --ref "$BRANCH"
