# Runs for every published release: one created by hand, or by the Auto
# Release workflow, which dispatches this (a release created with GITHUB_TOKEN
# starts no workflow by itself).
#
# Attaches the plugin archives to a GitHub release when it is published. It
# publishes to JetBrains Marketplace (a version like 0.1.0-beta goes to the
# beta channel) only when the secret PUBLISH_TOKEN is set, together with
# CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD; without it the
# release just gets its zips.

name: Release
on:
  release:
    types: [ prereleased, released ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing GitHub release to build and publish
        required: true

permissions:
  contents: read

jobs:

  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Read by the Publish Plugin step's condition; a step's own env is not
      # visible to its `if`.
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Maximize Build Space
        # Third-party action in a job that holds the signing and Marketplace
        # secrets: pinned to the v1.3.1 commit, not a movable tag.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The release's notes, for both the event and the manual start.
      - name: Read Release Notes
        id: notes
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RELEASE_NOTE"
          if [ -s "$RELEASE_NOTE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch Changelog
        if: ${{ steps.notes.outputs.present == 'true' }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # One archive per IDE line profile (platforms/), each with its own
      # build range and a version like 1.0.0-252.
      - name: Build Plugin
        run: |
          for platform in $(ls platforms); do
            ./gradlew buildPlugin -Pplatform="$platform"
          done

      - name: Upload Release Asset
        run: gh release upload "$TAG" ./build/distributions/* --clobber

      - name: Publish Plugin
        # Skipped unless a Marketplace token is configured.
        if: ${{ env.PUBLISH_TOKEN != '' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          for platform in $(ls platforms); do
            ./gradlew publishPlugin -Pplatform="$platform"
          done

      - name: Create Pull Request
        if: ${{ steps.notes.outputs.present == 'true' }}
        env:
          # Through the environment, not ${{ }} in the script: a tag name
          # can contain shell syntax.
          VERSION: ${{ env.TAG }}
        run: |
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # Nothing to do when the release commit already patched CHANGELOG.md.
          if git diff --quiet; then
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin "$BRANCH"

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          # The release assets are already uploaded at this point, so a
          # refused PR (the repository setting "Allow GitHub Actions to
          # create and approve pull requests" is off) must not fail the run.
          if ! gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head "$BRANCH"; then
            echo "::warning::Could not open the changelog PR. Open it manually: https://github.com/${{ github.repository }}/pull/new/$BRANCH"
          fi
