version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The Kotlin JVM and serialization plugins must move together.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
